<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="从早期宇宙，到今天的我们"><rect width="1000" height="620" fill="#101a24"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#dce6ee"><text x="50" y="65" font-size="30">从早期宇宙，到今天的我们</text><text x="50" y="103" font-size="17" fill="#9eb4c5">年代为近似值；不是按时间长度等比例绘制</text><path d="M80 310 H920" stroke="#617f96" stroke-width="4"/><circle cx="100" cy="310" r="10" fill="#dd936c"/><text x="100" y="240" text-anchor="middle" font-size="20">早期炽热宇宙</text><text x="100" y="270" text-anchor="middle" font-size="16" fill="#a8bfce">约138亿年前</text><circle cx="290" cy="310" r="10" fill="#dd936c"/><text x="290" y="380" text-anchor="middle" font-size="20">微波背景释放</text><text x="290" y="410" text-anchor="middle" font-size="16" fill="#a8bfce">大爆炸后约38万年</text><circle cx="480" cy="310" r="10" fill="#dd936c"/><text x="480" y="240" text-anchor="middle" font-size="20">恒星与星系演化</text><text x="480" y="270" text-anchor="middle" font-size="16" fill="#a8bfce">持续发生</text><circle cx="670" cy="310" r="10" fill="#dd936c"/><text x="670" y="380" text-anchor="middle" font-size="20">太阳系形成</text><text x="670" y="410" text-anchor="middle" font-size="16" fill="#a8bfce">约46亿年前</text><circle cx="860" cy="310" r="10" fill="#dd936c"/><text x="860" y="240" text-anchor="middle" font-size="20">今天的我们</text><text x="860" y="270" text-anchor="middle" font-size="16" fill="#a8bfce">继续观测与研究</text><text x="50" y="590" fill="#b4c3cf" font-size="15">太空+ · 自制教学示意图 · 非天文摄影</text></g></svg>