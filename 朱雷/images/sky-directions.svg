<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="把天空当作一个穹顶"><rect width="1000" height="620" fill="#101a24"/><g font-family="Microsoft YaHei,Arial,sans-serif" fill="#dce6ee"><text x="50" y="65" font-size="30">把天空当作一个穹顶</text><text x="50" y="103" font-size="17" fill="#9eb4c5">面向北方的概念示意；实际星空随纬度、日期和时刻变化</text><path d="M150 490 A350 350 0 0 1 850 490" fill="none" stroke="#668fa9" stroke-width="3"/><path d="M100 490 H900" stroke="#a9bdca" stroke-width="2"/><circle cx="500" cy="235" r="8" fill="#dd936c"/><path d="M500 235 V490" stroke="#dd936c" stroke-dasharray="7 7"/><text x="530" y="235" font-size="22">北极星：靠近北天极</text><text x="450" y="530" font-size="22">北方地平线</text><text x="160" y="530" font-size="22">西</text><text x="820" y="530" font-size="22">东</text><text x="355" y="170" font-size="18">不是夜空中最亮的恒星</text><text x="50" y="590" fill="#b4c3cf" font-size="15">太空+ · 自制教学示意图 · 非天文摄影</text></g></svg>