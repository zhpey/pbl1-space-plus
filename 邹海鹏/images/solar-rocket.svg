<svg xmlns="http://www.w3.org/2000/svg" width="640" height="840" viewBox="0 0 640 840" role="img"><title>从起飞到入轨：目标不只是高度</title><rect width="640" height="840" rx="12" fill="#0c1824"/><circle cx="570" cy="55" r="180" fill="#203c4b" opacity=".25"/><g font-family="Microsoft YaHei, sans-serif"><text x="32" y="38" fill="#dda779" font-size="14" letter-spacing="2">SPACE PLUS / CONCEPT NOTES</text><text x="32" y="83" fill="#e5edf2" font-size="29">从起飞到入轨：目标不只是高度</text><rect x="32" y="145" width="576" height="132" rx="8" fill="#142b3a" stroke="#527084" stroke-opacity=".5"/><text x="54" y="174" fill="#dda779" font-size="17">01</text><text x="54" y="212" fill="#e2edf4" font-size="31">喷气推进</text><text x="54" y="253" fill="#a9c2d1" font-size="24">动量交换产生推力</text><rect x="32" y="298" width="576" height="132" rx="8" fill="#142b3a" stroke="#527084" stroke-opacity=".5"/><text x="54" y="327" fill="#dda779" font-size="17">02</text><text x="54" y="365" fill="#e2edf4" font-size="31">逐级分离</text><text x="54" y="406" fill="#a9c2d1" font-size="24">减轻后续加速负担</text><rect x="32" y="451" width="576" height="132" rx="8" fill="#142b3a" stroke="#527084" stroke-opacity=".5"/><text x="54" y="480" fill="#dda779" font-size="17">03</text><text x="54" y="518" fill="#e2edf4" font-size="31">建立速度</text><text x="54" y="559" fill="#a9c2d1" font-size="24">形成绕地运动轨道</text><rect x="32" y="604" width="576" height="132" rx="8" fill="#142b3a" stroke="#527084" stroke-opacity=".5"/><text x="54" y="633" fill="#dda779" font-size="17">04</text><text x="54" y="671" fill="#e2edf4" font-size="31">在轨机动</text><text x="54" y="712" fill="#a9c2d1" font-size="24">同时规划位置与速度</text><text x="32" y="792" fill="#819dad" font-size="18">概念关系梳理 · 非真实比例或观测影像</text><text x="32" y="820" fill="#819dad" font-size="16">SPACE PLUS / 原创教学示意</text></g></svg>